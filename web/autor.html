<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autor · Biblioteca Aster</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--mov-deschis:#e8e0f5;--mov-pastel:#c9b8e8;--mov-mediu:#9b7dc8;--mov-inchis:#6b4fa0;--mov-profund:#4a3270;--lila:#d4c5ed;--alb-cald:#faf8fd;--text-principal:#2d1f4e;--text-secundar:#7a6a9a;--text-subtil:#b0a0cc;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--alb-cald);color:var(--text-principal);}
header{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--lila);background:white;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:0.6rem;text-decoration:none;}
.logo-svg{width:28px;height:28px;}
.logo-nume{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:600;color:var(--mov-profund);}
.nav-header{display:flex;gap:1.5rem;}
.nav-header a{text-decoration:none;font-size:0.85rem;color:var(--text-secundar);transition:color 0.2s;}
.nav-header a:hover{color:var(--mov-inchis);}
.page-wrapper{max-width:900px;margin:0 auto;padding:2rem 1.5rem 4rem;}
.btn-inapoi{display:inline-flex;align-items:center;gap:0.4rem;font-size:0.8rem;color:var(--text-secundar);cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;margin-bottom:2rem;}
.btn-inapoi svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
.autor-hero{display:flex;gap:2rem;background:white;border:1px solid var(--lila);border-radius:20px;padding:2rem;margin-bottom:2rem;align-items:flex-start;}
.autor-poza{width:140px;height:180px;border-radius:14px;background:linear-gradient(135deg,var(--mov-deschis),var(--mov-pastel));display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:3rem;color:var(--mov-inchis);font-family:'Cormorant Garamond',serif;font-weight:600;}
.autor-info{flex:1;}
.autor-nm{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:400;margin-bottom:0.5rem;}
.autor-meta{display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:1rem;}
.autor-badge{display:inline-flex;align-items:center;gap:0.35rem;font-size:0.75rem;padding:0.25rem 0.75rem;border-radius:20px;background:var(--mov-deschis);color:var(--mov-inchis);}
.autor-badge svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.5;}
.autor-bio{font-size:0.88rem;color:var(--text-secundar);line-height:1.75;}
.autor-stat{display:flex;gap:2rem;margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid var(--mov-deschis);}
.stat-item{text-align:center;}
.stat-nr{font-size:1.4rem;font-weight:600;color:var(--mov-inchis);}
.stat-lbl{font-size:0.7rem;color:var(--text-subtil);text-transform:uppercase;letter-spacing:0.08em;}
.sec-titlu{font-size:1rem;font-weight:500;margin-bottom:1rem;color:var(--text-principal);}
.grid-carti{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1rem;}
.card-carte{background:white;border:1px solid var(--lila);border-radius:14px;padding:1rem;cursor:pointer;transition:all 0.2s;text-decoration:none;display:block;}
.card-carte:hover{border-color:var(--mov-mediu);transform:translateY(-2px);box-shadow:0 4px 15px rgba(107,79,160,0.1);}
.carte-cop{background:linear-gradient(135deg,var(--mov-deschis),var(--lila));border-radius:10px;height:110px;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:500;color:var(--mov-inchis);text-align:center;padding:0.5rem;margin-bottom:0.75rem;line-height:1.4;}
.carte-titlu{font-size:0.83rem;font-weight:500;color:var(--text-principal);margin-bottom:0.25rem;line-height:1.3;}
.carte-gen{font-size:0.7rem;color:var(--text-subtil);margin-bottom:0.4rem;}
.carte-status{font-size:0.68rem;padding:2px 8px;border-radius:8px;display:inline-block;}
.disponibil{background:#e8f5e9;color:#2e7d32;}
.indisponibil{background:#fce4ec;color:#880e4f;}
.loading{text-align:center;padding:3rem;color:var(--text-subtil);}
footer{text-align:center;padding:1.5rem;font-size:0.75rem;color:var(--text-subtil);border-top:1px solid var(--mov-deschis);}
@media(max-width:600px){.autor-hero{flex-direction:column;}.autor-poza{width:100%;height:140px;}}
</style>
</head>
<body>
<header>
  <a href="/web/primapagina.html" class="logo">
    <svg class="logo-svg" viewBox="0 0 48 48" fill="none">
      <ellipse cx="24" cy="10" rx="3.5" ry="7" fill="#c9b8e8" transform="rotate(0 24 24)"/>
      <ellipse cx="24" cy="10" rx="3.5" ry="7" fill="#c9b8e8" transform="rotate(45 24 24)"/>
      <ellipse cx="24" cy="10" rx="3.5" ry="7" fill="#c9b8e8" transform="rotate(90 24 24)"/>
      <ellipse cx="24" cy="10" rx="3.5" ry="7" fill="#c9b8e8" transform="rotate(135 24 24)"/>
      <ellipse cx="24" cy="10" rx="3.5" ry="7" fill="#9b7dc8" transform="rotate(22.5 24 24)"/>
      <ellipse cx="24" cy="10" rx="3.5" ry="7" fill="#9b7dc8" transform="rotate(67.5 24 24)"/>
      <ellipse cx="24" cy="10" rx="3.5" ry="7" fill="#9b7dc8" transform="rotate(112.5 24 24)"/>
      <ellipse cx="24" cy="10" rx="3.5" ry="7" fill="#9b7dc8" transform="rotate(157.5 24 24)"/>
      <circle cx="24" cy="24" r="6" fill="#6b4fa0"/>
      <circle cx="24" cy="24" r="3.5" fill="#9b7dc8"/>
      <circle cx="24" cy="24" r="1.5" fill="#e8e0f5"/>
    </svg>
    <span class="logo-nume">Biblioteca Aster</span>
  </a>
  <nav class="nav-header">
    <a href="/web/catalog.html">Catalog</a>
    <a href="/web/anunturi.html">Evenimente</a>
    <a href="/web/cafenea.html">Cafenea</a>
    <a href="/web/despre.html">Despre</a>
  </nav>
</header>

<div class="page-wrapper">
  <button class="btn-inapoi" onclick="history.back()">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Înapoi
  </button>
  <div id="continut"><div class="loading">Se încarcă informațiile autorului...</div></div>
</div>

<footer>© 2026 Biblioteca Aster · Suceava, România</footer>

<script>
const params = new URLSearchParams(window.location.search);
const idAutor = params.get('id');

async function incarcaAutor() {
  const container = document.getElementById('continut');
  if (!idAutor) { container.innerHTML = '<div class="loading">ID autor lipsă.</div>'; return; }
  try {
    const r = await fetch('/api/autori/' + idAutor);
    if (!r.ok) throw new Error('Not found');
    const a = await r.json();
    const initiale = a.nume_complet.split(' ').map(x => x[0]).join('').substring(0,2).toUpperCase();
    const disponibile = a.carti.filter(c => c.exemplare_disponibile > 0).length;
    const totalEx = a.carti.reduce((s,c) => s + c.exemplare_disponibile, 0);

    container.innerHTML =
      '<div class="autor-hero">' +
        '<div class="autor-poza">' + initiale + '</div>' +
        '<div class="autor-info">' +
          '<div class="autor-nm">' + a.nume_complet + '</div>' +
          '<div class="autor-meta">' +
            (a.nationalitate ? '<span class="autor-badge"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>' + a.nationalitate + '</span>' : '') +
            (a.ani_activitate ? '<span class="autor-badge"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' + a.ani_activitate + '</span>' : '') +
            '<span class="autor-badge"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>' + a.carti.length + ' titluri</span>' +
          '</div>' +
          '<div class="autor-bio">' + (a.biografie || 'Biografie indisponibilă momentan.') + '</div>' +
          '<div class="autor-stat">' +
            '<div class="stat-item"><div class="stat-nr">' + a.carti.length + '</div><div class="stat-lbl">Titluri</div></div>' +
            '<div class="stat-item"><div class="stat-nr">' + disponibile + '</div><div class="stat-lbl">Disponibile</div></div>' +
            '<div class="stat-item"><div class="stat-nr">' + totalEx + '</div><div class="stat-lbl">Exemplare</div></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="sec-titlu">Cărți de ' + a.nume_complet + ' în biblioteca noastră</div>' +
      '<div class="grid-carti">' +
        (a.carti.length === 0
          ? '<div style="color:var(--text-subtil);font-size:0.85rem;">Nu avem momentan cărți ale acestui autor în colecție.</div>'
          : a.carti.map(function(c) {
              var titluCurat = c.titlu.replace(/_/g,' ');
              return '<a href="/web/carte.html?id=' + c.id + '" class="card-carte">' +
                '<div class="carte-cop">' + titluCurat + '</div>' +
                '<div class="carte-titlu">' + titluCurat + '</div>' +
                (c.gen_specific ? '<div class="carte-gen">' + c.gen_specific + '</div>' : '') +
                '<span class="carte-status ' + (c.exemplare_disponibile > 0 ? 'disponibil' : 'indisponibil') + '">' +
                (c.exemplare_disponibile > 0 ? c.exemplare_disponibile + ' disponibile' : 'Indisponibil') + '</span>' +
              '</a>';
            }).join('')) +
      '</div>';

    document.title = a.nume_complet + ' · Biblioteca Aster';
  } catch(e) {
    container.innerHTML = '<div class="loading">Autorul nu a putut fi încărcat.</div>';
  }
}

incarcaAutor();
</script>
</body>
</html>
