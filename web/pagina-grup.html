<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grup · Biblioteca Aster</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --mov-deschis: #e8e0f5; --mov-pastel: #c9b8e8; --mov-mediu: #9b7dc8;
  --mov-inchis: #6b4fa0; --mov-profund: #4a3270; --lila: #d4c5ed;
  --alb-cald: #faf8fd; --text-principal: #2d1f4e; --text-secundar: #7a6a9a;
  --text-subtil: #b0a0cc;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--alb-cald); color:var(--text-principal); }

header { display:flex; align-items:center; justify-content:space-between; padding:1rem 2rem; border-bottom:1px solid var(--lila); background:white; position:sticky; top:0; z-index:100; }
.logo { display:flex; align-items:center; gap:0.6rem; text-decoration:none; }
.logo-svg { width:28px; height:28px; }
.logo-nume { font-family:'Cormorant Garamond',serif; font-size:1.1rem; font-weight:600; color:var(--mov-profund); }

.page-wrapper { max-width:900px; margin:0 auto; padding:2rem 1.5rem 4rem; }

.btn-inapoi { display:inline-flex; align-items:center; gap:0.4rem; font-size:0.8rem; color:var(--text-secundar); cursor:pointer; background:none; border:none; font-family:'DM Sans',sans-serif; transition:color 0.2s; margin-bottom:1.5rem; }
.btn-inapoi:hover { color:var(--mov-inchis); }
.btn-inapoi svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; }

/* GRUP HEADER */
.grup-hero { background:linear-gradient(135deg, var(--mov-profund), var(--mov-inchis)); border-radius:20px; padding:2rem; margin-bottom:1.25rem; color:white; position:relative; overflow:hidden; }
.grup-hero::before { content:''; position:absolute; right:-40px; top:-40px; width:200px; height:200px; border-radius:50%; background:rgba(255,255,255,0.05); }
.grup-emoji { font-size:2.5rem; margin-bottom:0.75rem; }
.grup-titlu-mare { font-family:'Cormorant Garamond',serif; font-size:1.8rem; font-weight:400; margin-bottom:0.4rem; }
.grup-desc-hero { font-size:0.85rem; color:rgba(255,255,255,0.7); font-weight:300; margin-bottom:1.25rem; line-height:1.6; }
.grup-meta-hero { display:flex; gap:1.5rem; flex-wrap:wrap; }
.grup-meta-item { font-size:0.78rem; color:rgba(255,255,255,0.7); display:flex; align-items:center; gap:0.4rem; }
.grup-meta-item svg { width:13px; height:13px; stroke:var(--mov-pastel); fill:none; stroke-width:1.5; stroke-linecap:round; }
.grup-actiuni { display:flex; gap:0.75rem; margin-top:1.25rem; flex-wrap:wrap; }
.btn-grup { padding:0.55rem 1.25rem; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:0.82rem; cursor:pointer; transition:all 0.2s; border:none; font-weight:500; }
.btn-grup.primar { background:var(--mov-pastel); color:var(--mov-profund); }
.btn-grup.primar:hover { background:white; }
.btn-grup.chat { background:rgba(255,255,255,0.15); color:white; border:1px solid rgba(255,255,255,0.3); }
.btn-grup.chat:hover { background:rgba(255,255,255,0.25); }

/* TABS */
.tabs { display:flex; gap:0.5rem; margin-bottom:1.5rem; border-bottom:2px solid var(--mov-deschis); }
.tab { padding:0.6rem 1.1rem; font-size:0.83rem; cursor:pointer; color:var(--text-subtil); background:none; border:none; font-family:'DM Sans',sans-serif; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all 0.2s; }
.tab.activ { color:var(--mov-inchis); border-bottom-color:var(--mov-inchis); font-weight:500; }
.tab:hover { color:var(--mov-inchis); }

.tab-content { display:none; }
.tab-content.activ { display:block; }

/* DETALII */
.info-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem; }
.info-card { background:white; border:1px solid var(--lila); border-radius:14px; padding:1.25rem; }
.info-label { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-subtil); margin-bottom:0.3rem; }
.info-val { font-size:1rem; font-weight:500; color:var(--text-principal); }

/* CARTE CURENTA */
.carte-curenta { background:white; border:1px solid var(--lila); border-radius:16px; padding:1.5rem; margin-bottom:1rem; display:flex; gap:1.25rem; align-items:center; }
.coperta-grup { width:70px; height:95px; border-radius:8px; background:linear-gradient(135deg, var(--mov-deschis), var(--lila)); display:flex; align-items:center; justify-content:center; font-size:0.55rem; color:var(--mov-inchis); text-align:center; padding:4px; flex-shrink:0; }
.carte-info-grup h3 { font-family:'Cormorant Garamond',serif; font-size:1.2rem; margin-bottom:0.25rem; }
.carte-info-grup p { font-size:0.82rem; color:var(--text-secundar); margin-bottom:0.5rem; }
.progres-grup { height:4px; background:var(--mov-deschis); border-radius:2px; overflow:hidden; margin-top:0.75rem; }
.progres-fill { height:100%; background:var(--mov-inchis); border-radius:2px; }

/* MEMBRI */
.membri-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:0.75rem; }
.card-membru { background:white; border:1px solid var(--lila); border-radius:12px; padding:1rem; display:flex; align-items:center; gap:0.75rem; transition:all 0.2s; cursor:pointer; }
.card-membru:hover { border-color:var(--mov-pastel); box-shadow:0 2px 8px rgba(107,79,160,0.08); }
.membru-avatar { width:36px; height:36px; border-radius:50%; background:var(--mov-inchis); color:white; display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:600; flex-shrink:0; }
.membru-info { flex:1; }
.membru-nume { font-size:0.83rem; font-weight:500; }
.membru-username { font-size:0.72rem; color:var(--text-subtil); }
.badge-admin { font-size:0.6rem; background:var(--mov-deschis); color:var(--mov-inchis); padding:1px 5px; border-radius:6px; font-weight:500; }

/* CHAT */
.chat-wrapper { background:white; border:1px solid var(--lila); border-radius:16px; overflow:hidden; }
.chat-header { padding:1rem 1.25rem; border-bottom:1px solid var(--lila); display:flex; align-items:center; justify-content:space-between; }
.chat-titlu { font-size:0.88rem; font-weight:500; }
.chat-online { font-size:0.72rem; color:var(--text-subtil); display:flex; align-items:center; gap:0.3rem; }
.chat-online::before { content:''; width:6px; height:6px; border-radius:50%; background:#2e7d32; display:inline-block; }
.chat-mesaje { height:400px; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:0.75rem; }
.msg-row { display:flex; gap:0.6rem; align-items:flex-end; }
.msg-row.propriu { flex-direction:row-reverse; }
.msg-avatar { width:28px; height:28px; border-radius:50%; background:var(--mov-inchis); color:white; display:flex; align-items:center; justify-content:center; font-size:0.62rem; font-weight:600; flex-shrink:0; }
.msg-bubble { max-width:65%; padding:0.6rem 0.85rem; border-radius:12px; font-size:0.83rem; line-height:1.5; }
.msg-row:not(.propriu) .msg-bubble { background:var(--mov-deschis); color:var(--text-principal); border-radius:0 12px 12px 12px; }
.msg-row.propriu .msg-bubble { background:var(--mov-inchis); color:white; border-radius:12px 0 12px 12px; }
.msg-meta { font-size:0.65rem; color:var(--text-subtil); margin-top:0.2rem; }
.msg-row.propriu .msg-meta { text-align:right; }
.chat-input-row { padding:0.85rem 1rem; border-top:1px solid var(--lila); display:flex; gap:0.5rem; }
.chat-input { flex:1; padding:0.6rem 0.85rem; border:1px solid var(--lila); border-radius:10px; font-family:'DM Sans',sans-serif; font-size:0.85rem; outline:none; transition:border-color 0.2s; }
.chat-input:focus { border-color:var(--mov-mediu); }
.btn-send { padding:0.6rem 1.1rem; background:var(--mov-inchis); color:white; border:none; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:0.82rem; cursor:pointer; transition:background 0.2s; white-space:nowrap; }
.btn-send:hover { background:var(--mov-profund); }

/* NECESAR LOGIN */
.login-required { text-align:center; padding:2.5rem; background:white; border:1px solid var(--lila); border-radius:16px; }
.login-required p { font-size:0.85rem; color:var(--text-secundar); margin-bottom:1rem; }
.btn-login-req { padding:0.6rem 1.5rem; background:var(--mov-inchis); color:white; border:none; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:0.85rem; cursor:pointer; }

footer { text-align:center; padding:1.5rem; font-size:0.75rem; color:var(--text-subtil); border-top:1px solid var(--mov-deschis); }
</style>
</head>
<body>

<header>
  <a href="/web/primapagina.html" class="logo">
    <svg class="logo-svg" viewBox="0 0 48 48" fill="none">
      <ellipse cx="24" cy="10" rx="3.5" ry="7" fill="#c9b8e8" transform="rotate(0 24 24)"/>
      <ellipse cx="24" cy="10" rx="3.5" ry="7" fill="#c9b8e8" transform="rotate(45 24 24)"/>
      <ellipse cx="24" cy="10" rx="3.5" ry="7" fill="#c9b8e8" transform="rotate(90 24 24)"/>
      <ellipse cx="24" cy="10" rx="3.5" ry="7" fill="#c9b8e8" transform="rotate(135 24 24)"/>
      <ellipse cx="24" cy="10" rx="3.5" ry="7" fill="#9b7dc8" transform="rotate(22.5 24 24)"/>
      <ellipse cx="24" cy="10" rx="3.5" ry="7" fill="#9b7dc8" transform="rotate(67.5 24 24)"/>
      <ellipse cx="24" cy="10" rx="3.5" ry="7" fill="#9b7dc8" transform="rotate(112.5 24 24)"/>
      <ellipse cx="24" cy="10" rx="3.5" ry="7" fill="#9b7dc8" transform="rotate(157.5 24 24)"/>
      <circle cx="24" cy="24" r="6" fill="#6b4fa0"/>
      <circle cx="24" cy="24" r="3.5" fill="#9b7dc8"/>
      <circle cx="24" cy="24" r="1.5" fill="#e8e0f5"/>
    </svg>
    <span class="logo-nume">Biblioteca Aster</span>
  </a>
</header>

<div class="page-wrapper">
  <button class="btn-inapoi" onclick="history.back()">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Înapoi
  </button>
  <div id="continut-grup"></div>
</div>

<footer>© 2026 Biblioteca Aster · Suceava, România</footer>

<script>
const GRUPURI_DATE = {
  1: {
    emoji: '🧙', nume: 'Fantasy & SF Suckers', 
    desc: 'Discutăm cărți fantasy și SF în fiecare săptămână. Toți iubitorii de genuri speculative sunt bineveniți!',
    membri: 24, an: 2023, locatie: 'Corp B · Salon Literar',
    program: 'Vineri, 17:00 — 19:00',
    carteAcum: 'The Name of the Wind', autorAcum: 'Patrick Rothfuss',
    progres: 65,
    membri_lista: [
      {initiale:'AP', nume:'Andrei P.', username:'andrei_p', admin:true},
      {initiale:'MP', nume:'Maria P.', username:'maria_p', admin:false},
      {initiale:'IM', nume:'Ioana M.', username:'ioana_m', admin:false},
      {initiale:'CV', nume:'Cristian V.', username:'cris_v', admin:false},
      {initiale:'RD', nume:'Radu D.', username:'radu_d', admin:false},
    ]
  },
  2: {
    emoji: '📜', nume: 'Clasici Români',
    desc: 'Un grup dedicat literaturii române clasice și contemporane.',
    membri: 15, an: 2024, locatie: 'Corp B · Salon Literar',
    program: 'Vineri, 18:00 — 20:00',
    carteAcum: 'Ion', autorAcum: 'Liviu Rebreanu',
    progres: 40,
    membri_lista: [
      {initiale:'EP', nume:'Elena P.', username:'elena_p', admin:true},
      {initiale:'MN', nume:'Mihai N.', username:'mihai_n', admin:false},
    ]
  },
  3: {
    emoji: '🔭', nume: 'Știință & Cosmos',
    desc: 'Cărți de popularizare a științei, astronomie și fizică.',
    membri: 9, an: 2025, locatie: 'Corp E · Grand Hall Științific',
    program: 'Joi, 18:30 — 20:00',
    carteAcum: 'Cosmos', autorAcum: 'Carl Sagan',
    progres: 80,
    membri_lista: [
      {initiale:'AS', nume:'Alex S.', username:'alex_s', admin:true},
    ]
  }
};

// Mesaje salvate per grup in localStorage
function getMesajeGrup(idGrup) {
  return JSON.parse(localStorage.getItem('chat_grup_' + idGrup) || '[]');
}

function salveazaMesaj(idGrup, mesaj) {
  const mesaje = getMesajeGrup(idGrup);
  mesaje.push(mesaj);
  localStorage.setItem('chat_grup_' + idGrup, JSON.stringify(mesaje.slice(-100)));
}

function esteMembruGrup(idGrup, g) {
  // Verificare: grup 1 = implicit membru (Fantasy), altele din localStorage
  if (idGrup === 1) return true;
  const grupuriJoin = JSON.parse(localStorage.getItem('grupuri_joined') || '[]');
  return grupuriJoin.includes(idGrup) || grupuriJoin.includes(String(idGrup));
}

function afiseazaGrup() {
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get('id') || '1');

  const g = GRUPURI_DATE[id] || {
    emoji: '📚', 
    nume: decodeURIComponent(params.get('nume') || 'Grup de lectură'),
    desc: decodeURIComponent(params.get('desc') || ''),
    membri: parseInt(params.get('membri') || '10'),
    an: parseInt(params.get('an') || '2023'),
    locatie: 'Corp A', program: 'Săptămânal',
    carteAcum: 'În curs de selectare', autorAcum: '',
    progres: 0, membri_lista: []
  };

  document.title = `${g.nume} · Biblioteca Aster`;
  const eLogat = !!localStorage.getItem('prenume_user');
  const numeUser = localStorage.getItem('prenume_user') || '';
  const userInitiale = numeUser ? numeUser[0].toUpperCase() : 'U';
  const username = localStorage.getItem('username_client') || 'eu';
  const eMembru = esteMembruGrup(id, g);

  let html = `
    <div class="grup-hero">
      <div class="grup-emoji">${g.emoji}</div>
      <div class="grup-titlu-mare">${g.nume}</div>
      <div class="grup-desc-hero">${g.desc}</div>
      <div class="grup-meta-hero">
        <div class="grup-meta-item"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>${g.membri} membri</div>
        <div class="grup-meta-item"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Înființat în ${g.an}</div>
        <div class="grup-meta-item"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${g.locatie}</div>
        <div class="grup-meta-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${g.program}</div>
      </div>
      <div class="grup-actiuni">
        ${eMembru ? `
          <button class="btn-grup chat" onclick="schimbaTab('chat')">💬 Chat grup</button>
          <button class="btn-grup primar" style="background:rgba(255,255,255,0.2);cursor:default;" disabled>✓ Membru</button>
          <button class="btn-grup" style="background:rgba(220,50,50,0.3);color:white;border:1px solid rgba(255,255,255,0.2);" onclick="iesireGrup(${id})">Ieșire</button>
        ` : `
          <button class="btn-grup primar" onclick="alatureazaGrup(${id}, this)" id="btn-alatura-hero">+ Alătură-te</button>
        `}
      </div>
    </div>

    <div class="tabs">
      <button class="tab activ" onclick="schimbaTab('detalii')">📋 Detalii</button>
      <button class="tab" onclick="schimbaTab('membri')">👥 Membri (${g.membri})</button>
      <button class="tab" onclick="schimbaTab('chat')">💬 Chat</button>
    </div>

    <div class="tab-content activ" id="tab-detalii">
      <div class="info-grid">
        <div class="info-card"><div class="info-label">Membri activi</div><div class="info-val">${g.membri}</div></div>
        <div class="info-card"><div class="info-label">Înființat în</div><div class="info-val">${g.an}</div></div>
        <div class="info-card"><div class="info-label">Locație întâlniri</div><div class="info-val">${g.locatie}</div></div>
        <div class="info-card"><div class="info-label">Program</div><div class="info-val">${g.program}</div></div>
      </div>
      <div class="carte-curenta">
        <div class="coperta-grup">${g.carteAcum}</div>
        <div class="carte-info-grup">
          <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-subtil);margin-bottom:0.25rem;">Citim acum</div>
          <h3>${g.carteAcum}</h3>
          ${g.autorAcum ? `<p>${g.autorAcum}</p>` : ''}
          <div style="font-size:0.75rem;color:var(--text-subtil);margin-bottom:0.3rem;">Progres grup: ${g.progres}%</div>
          <div class="progres-grup"><div class="progres-fill" style="width:${g.progres}%"></div></div>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-membri">
      <div class="membri-grid">
        ${g.membri_lista.map(m => `
          <div class="card-membru" onclick="window.location.href='/web/profil-prieten.html?username=${m.username}&nume=${encodeURIComponent(m.nume)}&prieten=true'">
            <div class="membru-avatar">${m.initiale}</div>
            <div class="membru-info">
              <div class="membru-nume">${m.nume} ${m.admin ? '<span class="badge-admin">Admin</span>' : ''}</div>
              <div class="membru-username">@${m.username}</div>
            </div>
          </div>`).join('')}
        ${g.membri > g.membri_lista.length ? `<div style="font-size:0.78rem;color:var(--text-subtil);padding:1rem;text-align:center;grid-column:span 2;">... și alți ${g.membri - g.membri_lista.length} membri</div>` : ''}
      </div>
    </div>

    <div class="tab-content" id="tab-chat">`;

  if (eLogat && eMembru) {
    // Incarca mesaje salvate + mesaje initiale
    const mesajeSalvate = getMesajeGrup(id);
    const mesajeInitiale = g.mesaje || [
      {user:'andrei_p', initiale:'AP', text:'Bună tuturor! Cine a ajuns la capitolul 20?', ora:'Luni 14:32'},
      {user:'ioana_m', initiale:'IM', text:'Eu! Rothfuss scrie absolut fabulos 😍', ora:'Luni 14:45'},
    ];
    
    // Combina mesajele initiale cu cele salvate
    const toateMesajele = [...mesajeInitiale, ...mesajeSalvate];
    
    html += `
      <div class="chat-wrapper">
        <div class="chat-header">
          <div class="chat-titlu">💬 Chat — ${g.nume}</div>
          <div class="chat-online">${g.membri} membri</div>
        </div>
        <div class="chat-mesaje" id="chat-mesaje">
          ${toateMesajele.map(m => `
            <div>
              <div class="msg-row ${m.user === username || m.propriu ? 'propriu' : ''}">
                <div class="msg-avatar">${m.initiale || userInitiale}</div>
                <div>
                  <div class="msg-bubble">${m.text}</div>
                  <div class="msg-meta">${m.user === username || m.propriu ? 'Tu' : m.user} · ${m.ora}</div>
                </div>
              </div>
            </div>`).join('')}
        </div>
        <div class="chat-input-row">
          <input type="text" class="chat-input" id="chat-input" placeholder="Scrie un mesaj..." 
            onkeydown="if(event.key==='Enter')trimiteMesaj(${id})"/>
          <button class="btn-send" onclick="trimiteMesaj(${id})">Trimite</button>
        </div>
      </div>`;
  } else if (eLogat && !eMembru) {
    html += `
      <div class="login-required">
        <svg viewBox="0 0 24 24" style="width:40px;height:40px;stroke:var(--mov-pastel);fill:none;stroke-width:1;margin-bottom:0.75rem;">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <p>Trebuie să fii membru al grupului pentru a vedea chatul.</p>
        <button class="btn-login-req" onclick="alatureazaGrup(${id}, this)">+ Alătură-te pentru a accesa chatul</button>
      </div>`;
  } else {
    html += `
      <div class="login-required">
        <svg viewBox="0 0 24 24" style="width:40px;height:40px;stroke:var(--mov-pastel);fill:none;stroke-width:1;margin-bottom:0.75rem;">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <p>Trebuie să fii autentificat pentru a accesa chatul.</p>
        <button class="btn-login-req" onclick="window.location.href='/web/login.html'">Autentifică-te</button>
      </div>`;
  }

  html += `</div>`;
  document.getElementById('continut-grup').innerHTML = html;
  
  setTimeout(() => {
    const chat = document.getElementById('chat-mesaje');
    if (chat) chat.scrollTop = chat.scrollHeight;
  }, 100);
}

function schimbaTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    const tabs = ['detalii', 'membri', 'chat'];
    t.classList.toggle('activ', tabs[i] === tab);
  });
  document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('activ'));
  const el = document.getElementById('tab-' + tab);
  if (el) {
    el.classList.add('activ');
    if (tab === 'chat') {
      setTimeout(() => {
        const chat = document.getElementById('chat-mesaje');
        if (chat) chat.scrollTop = chat.scrollHeight;
        document.getElementById('chat-input')?.focus();
      }, 50);
    }
  }
}

async function trimiteMesaj(idGrup) {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;

  const numeUser = localStorage.getItem('prenume_user') || 'Tu';
  const userInitiale = numeUser[0].toUpperCase();
  const username = localStorage.getItem('username_client') || 'eu';
  const ora = new Date().toLocaleTimeString('ro-RO', {hour:'2-digit', minute:'2-digit'});

  // Salveaza in localStorage
  const mesajNou = {user: username, initiale: userInitiale, text, ora, propriu: true};
  salveazaMesaj(idGrup, mesajNou);

  // Adauga vizual
  const chat = document.getElementById('chat-mesaje');
  const msgDiv = document.createElement('div');
  msgDiv.innerHTML = `
    <div class="msg-row propriu">
      <div class="msg-avatar">${userInitiale}</div>
      <div>
        <div class="msg-bubble">${text}</div>
        <div class="msg-meta">Tu · ${ora}</div>
      </div>
    </div>`;
  chat.appendChild(msgDiv);
  chat.scrollTop = chat.scrollHeight;
  input.value = '';

  // Trimite la server (optional)
  try {
    const idClient = localStorage.getItem('id_client') || -1;
    await fetch('/api/mesaje', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id_grup: idGrup, id_client: parseInt(idClient), text, username})
    });
  } catch(e) {}
}

function alatureazaGrup(idGrup, btn) {
  if (!localStorage.getItem('prenume_user')) {
    window.location.href = '/web/login.html';
    return;
  }
  const grupuriJoin = JSON.parse(localStorage.getItem('grupuri_joined') || '[]');
  if (!grupuriJoin.includes(idGrup)) {
    grupuriJoin.push(idGrup);
    localStorage.setItem('grupuri_joined', JSON.stringify(grupuriJoin));
  }
  if (btn) {
    btn.textContent = '✓ Solicitare trimisă';
    btn.style.background = 'rgba(255,255,255,0.25)';
    btn.disabled = true;
  }
  // Reincarca pagina pentru a vedea chatul
  setTimeout(() => window.location.reload(), 800);
}

function iesireGrup(idGrup) {
  if (!confirm('Ești sigur că vrei să ieși din acest grup?')) return;
  const grupuriJoin = JSON.parse(localStorage.getItem('grupuri_joined') || '[]');
  const nou = grupuriJoin.filter(id => id !== idGrup && id !== String(idGrup));
  localStorage.setItem('grupuri_joined', JSON.stringify(nou));
  window.location.reload();
}

afiseazaGrup();
</script>
